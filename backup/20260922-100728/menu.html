<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perimeter — Choose Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="blob blob-a"></div>
<div class="blob blob-b"></div>
<div class="blob blob-c"></div>
<div class="blob blob-d"></div>
<div class="blob blob-e"></div>

<div class="console menu-console">

  <div class="menu-intro">
    <h1 class="menu-title">Choose an activity</h1>
  </div>

  <main class="menu-grid">

    <a class="menu-card glass" href="/camera">
      <div class="icon-c">
        <svg width="40" height="40" viewBox="0 0 27 27" fill="none">
          <rect x="2.5" y="7.5" width="17" height="13" rx="3" stroke="white" stroke-width="2.6"/>
          <path d="M19.5 12 25 8.3v11.4l-5.5-3.3" stroke="white" stroke-width="2.6" stroke-linejoin="round"/>
          <circle cx="11" cy="14" r="2.9" stroke="white" stroke-width="2.6"/>
        </svg>
      </div>
      <span class="menu-card-tag">Fig. 3.1 – 3.2</span>
      <span class="menu-card-title">Camera Watch</span>
      <p class="menu-card-desc">Live camera feed, motion-triggered snapshots, event log, and arm/disarm control.</p>
      <span class="menu-card-cta">Open dashboard →</span>
    </a>

    <a class="menu-card glass" href="/buzzer">
      <div class="icon-c">
        <svg width="40" height="40" viewBox="0 0 27 27" fill="none">
          <circle cx="13.5" cy="13.5" r="10.8" stroke="white" stroke-width="2.6"/>
          <path d="M7.8 13.5a5.7 5.7 0 0 1 11.4 0" stroke="white" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="13.5" cy="13.5" r="2.1" fill="white"/>
        </svg>
      </div>
      <span class="menu-card-tag">Fig. 3.3</span>
      <span class="menu-card-title">Buzzer + Graph</span>
      <p class="menu-card-desc">Active buzzer alert, live sensor-reading graph, and 5-second motion recordings.</p>
      <span class="menu-card-cta">Open dashboard →</span>
    </a>

  </main>

</div>

</body>
</html>
